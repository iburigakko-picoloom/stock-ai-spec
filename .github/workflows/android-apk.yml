name: Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'web/**'
      - 'mobile/**'
      - 'src/stock_ai/**'
      - 'tests/test_mobile*.py'
      - 'tests/test_android_lifecycle_controller.py'
      - 'tests/test_chatgpt_research.py'
      - 'tests/test_research_workflow.py'
      - 'tests/test_production_research.py'
      - 'tests/test_features.py'
      - 'scripts/*mobile*.py'
      - 'scripts/android_*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'web/**'
      - 'mobile/**'
      - 'src/stock_ai/**'
      - 'tests/test_mobile*.py'
      - 'tests/test_android_lifecycle_controller.py'
      - 'tests/test_chatgpt_research.py'
      - 'tests/test_research_workflow.py'
      - 'tests/test_production_research.py'
      - 'tests/test_features.py'
      - 'scripts/*mobile*.py'
      - 'scripts/android_*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
    inputs:
      lifecycle_delivery:
        description: 'OS delivery observation (unforced retains the 200s acceptance window)'
        type: choice
        options: [screen-wake-and-scheduler, unforced]
        default: screen-wake-and-scheduler

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        # Use the same locked research dependencies to generate PC references.
        run: |
          python -m pip install uv==0.10.0
          uv sync --locked --all-groups
          npm ci --prefix web
      - name: Shared Python and persistence tests
        env:
          STOCK_AI_CODE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p .demo-artifacts
          uv run ruff check .
          uv run mypy src
          uv run mypy src --platform win32
          uv run python -m pytest tests/test_android_lifecycle_controller.py -q --basetemp=.demo-artifacts/pytest-lifecycle-controller-ci
          uv run python -m pytest tests/test_mobile_runtime.py tests/test_mobile_personal.py tests/test_mobile_models.py tests/test_mobile_bundles.py tests/test_mobile_forecasts.py tests/test_mobile_decisions.py tests/test_mobile_research.py tests/test_mobile_market.py tests/test_mobile_market_codec.py tests/test_mobile_universe.py tests/test_mobile_membership.py tests/test_mobile_release.py tests/test_bounded_decision.py tests/test_decision_engine.py tests/test_domain.py tests/test_daily_contracts.py tests/test_personal_comparison.py tests/test_production_research.py tests/test_features.py tests/test_chatgpt_research.py tests/test_research_workflow.py tests/test_operations_store.py tests/test_operations_api.py -q --basetemp=.demo-artifacts/pytest-mobile-ci
          uv run python -m pytest tests/test_research_checkpoint.py::test_fold_checkpoint_is_atomic_authenticated_and_read_only_status tests/test_locked_holdout.py::test_locked_holdout_resumes_components_and_never_refits_successes tests/test_research_memory.py::test_fit_guard_blocks_before_model_and_records_actual_headroom tests/test_research_memory.py::test_low_headroom_never_calls_fit -q --basetemp=.demo-artifacts/pytest-platform-ci
      - name: Prepare offline interpreter and PC reference vectors
        env:
          PYTHONPATH: src
        run: |
          uv run python scripts/prepare_mobile.py --download
          uv run python -m scripts.generate_mobile_golden
      - name: React and TypeScript checks
        working-directory: web
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.mobile.config.ts
          npx playwright test --config playwright.compute.config.ts
          npx playwright test e2e/company-research.spec.ts
      - name: Validate package contents
        run: |
          uv run python scripts/android_source_audit.py
          uv run python scripts/android_package_audit.py web/dist
      - name: Synthetic full-market storage capacity
        timeout-minutes: 15
        env:
          PYTHONPATH: src
        run: uv run python -m scripts.mobile_capacity_check --output .demo-artifacts/mobile-capacity-ci --symbols 5000 --sessions 300 --checkpoint 100
      - name: Synthetic full-market latest features
        timeout-minutes: 12
        env:
          PYTHONPATH: src
        run: uv run python -m scripts.mobile_feature_check --source .demo-artifacts/mobile-capacity-ci --report .demo-artifacts/mobile-capacity-ci/latest-features.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-storage-capacity
          path: |
            .demo-artifacts/mobile-capacity-ci/report.json
            .demo-artifacts/mobile-capacity-ci/latest-features.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-web
          path: web/dist
          retention-days: 3


  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Start isolated Android emulator
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -n "$SDKMANAGER"
          export PATH="$(dirname "$SDKMANAGER"):$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/stockai-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          sdkmanager --install 'system-images;android-35;default;x86_64' 'emulator' > "$RUNNER_TEMP/stockai-sdk.log"
          echo no | avdmanager create avd --force --name stockai-ci --path "$ANDROID_AVD_HOME/stockai-ci.avd" --package 'system-images;android-35;default;x86_64' --device pixel_2
          # New command-line tools and the emulator have different default
          # Android user directories. Register the explicit, isolated AVD path.
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/stockai-ci.avd" > "$ANDROID_AVD_HOME/stockai-ci.ini"
          test -f "$ANDROID_AVD_HOME/stockai-ci.avd/config.ini"
          export QT_QPA_PLATFORM=offscreen
          nohup "$ANDROID_HOME/emulator/emulator" -avd stockai-ci -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader -feature -Vulkan -memory 2048 -cores 2 -camera-back none -camera-front none > "$RUNNER_TEMP/stockai-emulator.log" 2>&1 < /dev/null &
          if ! timeout 120 adb wait-for-device; then
            tail -n 160 "$RUNNER_TEMP/stockai-emulator.log"
            exit 1
          fi
          BOOTED=false
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then BOOTED=true; break; fi
            sleep 2
          done
          if [ "$BOOTED" != true ]; then tail -n 160 "$RUNNER_TEMP/stockai-emulator.log"; exit 1; fi
      - name: Prepare APK assets
        run: |
          npm ci --prefix web
          python scripts/prepare_mobile.py --download
          npm run build --prefix web
          python scripts/android_package_audit.py web/dist
      - name: Android compiler, backup crypto tests and lint
        working-directory: web
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Android persistence tests
        working-directory: web/android
        run: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=jp.stockai.app.DailyLifecycleTest
      - name: Real worker recovery and OS dispatch evidence
        timeout-minutes: 20
        env:
          LIFECYCLE_DELIVERY: ${{ inputs.lifecycle_delivery || 'screen-wake-and-scheduler' }}
        run: |
          case "$LIFECYCLE_DELIVERY" in
            unforced) python scripts/android_lifecycle_check.py ;;
            screen-wake-and-scheduler) python scripts/android_lifecycle_check.py --dispatch-ready ;;
            *) exit 2 ;;
          esac
      - name: Android diagnostics
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/stockai-emulator.log" || true
          adb devices -l || true
          adb shell dumpsys webviewupdate || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-test-reports
          path: |
            web/android/app/build/reports/tests
            web/android/app/build/reports/androidTests
            web/android/app/build/outputs/androidTest-results
            .demo-artifacts/android-lifecycle/lifecycle-report.json
            .demo-artifacts/android-lifecycle/*.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop emulator
        if: always()
        run: |
          "$ANDROID_HOME/platform-tools/adb" emu kill || true

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare signed build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stockai-signing.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/stockai-signing.p12" >> "$GITHUB_ENV"
          echo "STOCKAI_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "STOCKAI_VERSION_NAME=0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          npm ci --prefix web
          python scripts/prepare_mobile.py --download
      - name: Build native Android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm run build --prefix web
          cd web
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify signing and create release manifest
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp web/android/app/build/outputs/apk/release/app-release.apk release/StockAI.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs release/StockAI.apk > release/signature.txt
          python scripts/android_package_audit.py release/StockAI.apk
          python scripts/android_release_manifest.py
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v$STOCKAI_VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists. Never overwrite a published APK or reuse a versionCode."
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "StockAI $STOCKAI_VERSION_NAME (研究用)" --notes-file release/CHANGELOG.md --draft
          gh release upload "$TAG" release/StockAI.apk release/update.json release/SHA256SUMS release/signature.txt
          gh release edit "$TAG" --draft=false --latest
      - name: Remove ephemeral signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/stockai-signing.p12"
